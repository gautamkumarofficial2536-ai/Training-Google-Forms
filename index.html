<!DOCTYPE html>
<html>
<head>
    <title>Timed Assessment</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; }
        #timer-bar { background: #d9534f; color: white; padding: 15px; position: fixed; top: 0; width: 100%; font-size: 24px; font-weight: bold; z-index: 1000; }
        iframe { margin-top: 60px; width: 100%; height: 90vh; border: none; }
        #lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; padding-top: 20%; font-size: 30px; }
    </style>
</head>
<body>

    <div id="timer-bar">Time Remaining: <span id="time">30:00</span></div>
    <div id="lock-screen">Time's up! Your quiz has been automatically submitted.</div>

    <!-- PASTE YOUR GOOGLE FORM EMBED LINK IN THE SRC BELOW -->
    <iframe id="googleForm" src="<iframe src="https://docs.google.com/forms/d/1LRg5DZ5Xqgk2i_upW0adg6Lpg1TntOpOrpSvXKsM970/edit"></iframe>

    <script>
        // Set time limit in seconds (e.g., 30 minutes = 1800 seconds)
        let timeLimit = 1800; 
        const timerElement = document.getElementById('time');
        const formElement = document.getElementById('googleForm');
        const lockElement = document.getElementById('lock-screen');

        const countdown = setInterval(function() {
            let minutes = Math.floor(timeLimit / 60);
            let seconds = timeLimit % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerElement.textContent = minutes + ":" + seconds;

            if (timeLimit <= 0) {
                clearInterval(countdown);
                autoSubmitForm();
            }
            timeLimit--;
        }, 1000);

        function autoSubmitForm() {
            // Displays lock screen over the form so they cannot type further
            lockElement.style.display = 'block';
            
            // Forces the iframe to trigger its form submission targets
            formElement.contentWindow.postMessage('submit', '*');
            
            // As a bulletproof fallback, it refreshes the frame to cut off input access entirely
            setTimeout(() => { formElement.src = formElement.src; }, 1000);
        }
    </script>
</body>
</html>
