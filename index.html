<!DOCTYPE html>
<html>
<head>
    <title>Timed Secure Assessment</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f4f9; overflow: hidden; }
        #timer-header { background: #0078d4; color: white; padding: 12px; position: fixed; top: 0; width: 100%; font-size: 20px; font-weight: bold; z-index: 1000; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        iframe { margin-top: 50px; width: 100%; height: 94vh; border: none; }
    </style>
</head>
<body>

    <div id="timer-header">📋 Active Assessment Session (Do Not Refresh Page)</div>

    <iframe id="assessmentForm" src="https://docs.google.com/forms/d/e/1FAIpQLSdBCfd8wEDnUxqhsAdjR3EWngbzD8SiQNcoHpiM0H9MQ6eyqw/viewform?usp=preview?embedded=true">Loading…</iframe>

    <script>
        // Prevents students from accidentally losing data by warning them if they try to refresh
        window.onbeforeunload = function() {
            return "Are you sure you want to leave? Your current exam progress will be lost.";
        };
    </script>
</body>
</html>
